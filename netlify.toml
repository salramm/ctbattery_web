# Next.js static export. This repo's root IS the web app.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Same-origin proxy: the static frontend calls /api/* and Netlify forwards to the
# backend API on the DigitalOcean droplet. Avoids browser CORS entirely.
# NOTE: uncomment/point at the real API host once the droplet + DNS are live.
# [[redirects]]
#   from = "/api/*"
#   to = "https://api.ctbatterysolutions.com/api/:splat"
#   status = 200
#   force = true
