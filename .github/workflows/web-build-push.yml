name: Build & push

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # NEXT_PUBLIC_API_BASE_URL blank → the app calls same-origin /api,
          # which nginx proxies to the backend. Maps key is public (bundle-baked).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          # prod compose pulls :latest, dev compose pulls :dev — build once, tag both.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ctbs-web:latest
            ${{ secrets.DOCKER_USERNAME }}/ctbs-web:dev
            ${{ secrets.DOCKER_USERNAME }}/ctbs-web:${{ github.sha }}
