server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy the API to the backend container on the same Docker network.
  # Full /api/... URI is passed through (backend mounts routes under /api).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Next.js static export (trailingSlash: true → each route is a folder/index.html).
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Long-cache the immutable Next asset bundle.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
